[package]
name = "afterten-karaoke"
version = "1.0.0"
description = "AfterTen Karaoke - The ultimate karaoke experience"
authors = ["AfterTen Karaoke Team"]
edition = "2021"

[lib]
name = "afterten_karaoke_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Audio: native output (ASIO / WASAPI) + decoding
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "vorbis", "flac", "wav", "pcm", "isomp4", "mkv", "ogg"] }
rubato = "0.15"

# Audio analysis: pitch detection, BPM estimation
rustfft = "6"

# CREPE deep-learning pitch detection (bundled by default)
# ort loads the ONNX Runtime DLL at runtime via load-dynamic to avoid
# CRT mismatch with +crt-static. onnxruntime.dll is bundled in
# bundled/native/ by the CI workflow.
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"], optional = true }
ndarray = { version = "0.17", optional = true }

# Async runtime for blocking analysis tasks & HTTP requests
tokio = { version = "1", features = ["rt", "macros"] }

# HTTP client for fetching chart data (Apple Music RSS, Deezer API)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# SQLite for local offline storage
rusqlite = { version = "0.31", features = ["bundled"] }

# Windows: direct WebView2 COM access — profile-level tracking prevention
# OFF so embedded YouTube videos don't flood the console with blocked
# storage accesses (googlevideo.com media segments). Versions are pinned to
# the ones already in the tree via tauri-runtime-wry → wry.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.54"

[features]
# Production defaults: CREPE pitch detection.
default = ["crepe"]
asio = ["cpal/asio"]
crepe = ["ort", "ndarray"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
