<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke ZERO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 40%, #0d0d2b 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  .container { text-align: center; }

  .icon {
    font-size: 4.5rem;
    margin-bottom: 1.25rem;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 45, 149, 0.4));
  }

  .title {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    background: linear-gradient(135deg, #ff2d95 0%, #ff6b9d 50%, #c850c0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 2.5rem;
  }

  .bar-track {
    width: 220px;
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    margin: 0 auto 1.5rem;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    position: absolute;
    left: 0; top: 0; height: 100%;
    width: 35%;
    background: linear-gradient(90deg, transparent, #ff2d95, #c850c0, transparent);
    border-radius: 3px;
    animation: sweep 1.6s ease-in-out infinite;
  }

  .hint {
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.25);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes sweep {
    0%   { left: -35%; }
    100% { left: 100%; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">&#x1F3A4;</div>
    <div class="title">Karaoke ZERO</div>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="hint">wird gestartet...</div>
  </div>
</body>
</html>
