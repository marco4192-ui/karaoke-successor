# ════════════════════════════════════════════════════════════════════════
#  Karaoke ZERO — 100 % Standalone-Builds (Windows · macOS · Linux)
# ════════════════════════════════════════════════════════════════════════
#  Ein einziger Workflow für alle drei Plattformen. Alle Builds laufen auf
#  „nacken“ Systemen (frisches OS, kein Node.js, kein Browser, kein Internet
#  zur Installationszeit — Online-Inhalte wie YouTube-Embeds ausgenommen):
#
#    Windows : NSIS-Installer mit OFFLINE eingebettetem WebView2-Installer
#              (tauri.conf.json → bundle.windows.webviewInstallMode
#               = {type: "offlineInstaller"}) + portables node.exe +
#              ONNX-Runtime + VC++-Runtime-DLLs im Bundle
#    macOS   : Universal-Binary (Intel + Apple Silicon). Node.js wird per
#              lipo zu einem Universal-Binary gemergt; ONNX-Runtime kommt
#              als fertiges Universal2-Asset von Microsoft. DMG läuft ab
#              macOS 10.15. Optional Signing+Notarization via Secrets
#              (ohne Secrets: unsignierter Build, Gatekeeper-Hinweis)
#    Linux   : AppImage mit gebündeltem WebKitGTK (linuxdeploy folgt den
#              ldd-Abhängigkeiten automatisch) UND GStreamer-Medien-
#              codecs (bundleMediaFramework + gst-Pakete auf dem Runner);
#              zusätzlich deb für Paket-Manager
#
#  Alle Plattformen nutzen die kanonischen Repo-Skripte (identisch zum
#  lokalen `bun run tauri:build`):
#    scripts/download-node.mjs         → portables Node.js
#    scripts/download-onnxruntime.mjs  → ONNX-Runtime (CREPE-Pitch)
#    scripts/prepare-bundle.mjs        → Next.js standalone + custom
#                                        server.js + Socket.IO-Server
#
#  Trigger:
#    • Tag „v*“ pushen          → baut alles + erstellt DRAFT-Release
#    • „Run workflow“ in der Actions-UI → Plattformen/Release wählbar
#
#  Ersetzt die bisherigen Workflows „Build Executables“ + „Release“
#  (Doppel-Builds auf denselben Tag, Windows ohne tauri build/WebView2,
#  macOS/Linux ohne ONNX und ohne Socket.IO-Server).
# ════════════════════════════════════════════════════════════════════════

name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (z. B. v1.0.1) — wird ins tauri.conf.json geschrieben'
        required: true
        default: 'v1.0.1'
      build_windows:
        description: 'Windows-Build (NSIS-Installer, offline-fähig)'
        required: true
        default: true
        type: boolean
      build_macos:
        description: 'macOS-Build (Universal-Binary DMG)'
        required: true
        default: true
        type: boolean
      build_linux:
        description: 'Linux-Build (AppImage + deb)'
        required: true
        default: true
        type: boolean
      create_release:
        description: 'Draft-Release erstellen (bei Tag-Push immer aktiv)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 'latest'
  NODE_VERSION: '22.14.0'
  # ONNX Runtime 1.20.0 = exakt die Version, gegen die der `ort`-Crate
  # 2.0.0-rc.12 gebaut ist (Default in scripts/download-onnxruntime.mjs;
  # C-ABI-abwärtskompatibel, bei Bedurf hier zentral anheben).
  ONNX_VERSION: '1.20.0'
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ────────────────────────────────────────────────────────────────────
  #  Windows — NSIS-Installer (100 % offline-fähig)
  # ────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows · NSIS (offline-fähig)
    runs-on: windows-latest
    timeout-minutes: 90
    if: ${{ github.event.inputs.build_windows != 'false' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Rust einrichten (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: MSVC-Umgebung aktivieren
        uses: ilammy/msvc-dev-cmd@v1

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: JavaScript-Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Version aus Tag/Dispatch ins tauri.conf.json schreiben
        shell: bash
        env:
          RV: ${{ env.RELEASE_VERSION }}
        run: |
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));const v=(process.env.RV||"").replace(/^v/,"");if(v){c.version=v;fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");console.log("tauri.conf.json Version ->",v)}else{console.log("Keine Version gesetzt, behalte",c.version)}'

      - name: Portables Node.js herunterladen (bundled/node/node.exe)
        shell: bash
        run: node scripts/download-node.mjs --version ${{ env.NODE_VERSION }}

      - name: ONNX Runtime herunterladen (bundled/native/onnxruntime.dll)
        shell: bash
        run: node scripts/download-onnxruntime.mjs --version ${{ env.ONNX_VERSION }}

      # VC++-Runtime mitbündeln: Rust-MSVC-Binaries brauchen vcruntime140 —
      # auf einem „nackten“ Windows ohne Updates ist das nicht garantiert.
      - name: VC++-Runtime-DLLs bündeln (für nackte Systeme)
        shell: pwsh
        run: |
          $dest = "src-tauri\bundled\native"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $copied = 0
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $msvcPath = & $vswhere -latest -property installationPath 2>$null
            if ($msvcPath) {
              $redistDir = Get-ChildItem "$msvcPath\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue |
                Sort-Object -Descending | Select-Object -First 1
              if ($redistDir) {
                $crtDir = Join-Path $redistDir.FullName "x64\Microsoft.VC143.CRT"
                if (Test-Path $crtDir) {
                  foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
                    $src = Join-Path $crtDir $dll
                    if (Test-Path $src) { Copy-Item $src "$dest\$dll" -Force; $copied++ }
                  }
                }
              }
            }
          }
          if ($copied -lt 3) {
            Write-Host "Fallback: System32 (auf Runnern immer vorhanden)"
            foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
              if (-not (Test-Path "$dest\$dll")) {
                $sys32 = Join-Path $env:SystemRoot "System32\$dll"
                if (Test-Path $sys32) { Copy-Item $sys32 "$dest\$dll" -Force; $copied++ }
              }
            }
          }
          if ($copied -lt 3) { Write-Error "VC++-Runtime-DLLs unvollständig ($copied/3)"; exit 1 }
          Get-ChildItem $dest | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)" }

      # Kanonisches Bundling (identisch zu lokal): Next.js standalone,
      # custom server.js + Socket.IO-Server (socketio-server.cjs),
      # Kopie portable-node → bundled/node
      - name: Frontend + Server-Bundle vorbereiten (prepare-bundle.mjs)
        shell: bash
        env:
          NEXT_PUBLIC_LEADERBOARD_URL: ${{ secrets.NEXT_PUBLIC_LEADERBOARD_URL }}
          NEXT_PUBLIC_LEADERBOARD_API_KEY: ${{ secrets.NEXT_PUBLIC_LEADERBOARD_API_KEY }}
        run: node scripts/prepare-bundle.mjs

      - name: Tauri bauen (NSIS mit offline eingebettetem WebView2-Installer)
        # WICHTIG: pwsh, NICHT bash! In git-bash steht C:\Program Files\
        # Git\usr\bin vorne im PATH -> rustc erwischt dort Gits POSIX-
        # link.exe statt des MSVC-Linkers (klassische CI-Falle:
        # "/usr/bin/link: extra operand" + link.exe exit code 1). In pwsh
        # wird Git-usr\bin NICHT vor den PATH gesetzt -> MSVC-Linker.
        shell: pwsh
        run: bunx tauri build --bundles nsis

      # Sanity-Check: ohne eingebetteten WebView2-Offline-Installer wäre der
      # NSIS-Installer nur ~40 MB; mit ihm ~110–160 MB.
      - name: Installer verifizieren (WebView2 offline eingebettet?)
        shell: bash
        run: |
          set -euo pipefail
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          sizeMB=$(( $(wc -c < "$exe") / 1048576 ))
          echo "NSIS-Installer: $exe — ${sizeMB} MB"
          if [ "$sizeMB" -lt 70 ]; then
            echo "::error::Installer nur ${sizeMB} MB (< 70 MB) — WebView2-Offline-Installer vermutlich NICHT eingebettet (webviewInstallMode=offlineInstaller pruefen)."
            exit 1
          fi
          echo "OK: Groesse plausibel — WebView2-Offline-Installer eingebettet."

      - name: Artefakt hochladen (NSIS-Installer)
        uses: actions/upload-artifact@v5
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  #  macOS — Universal-Binary (Intel + Apple Silicon)
  # ────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS · Universal (Intel + Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 120
    if: ${{ github.event.inputs.build_macos != 'false' }}
    env:
      # WICHTIG: Der `secrets`-Context ist in `if:`-Bedingungen NICHT
      # erlaubt — GitHub validiert die Datei dann komplett ab (Fehler:
      # „Unrecognized named-value: 'secrets'“). Der Secret-Status wird
      # deshalb hier (in job-env ist `secrets` erlaubt) einmalig in eine
      # normale Umgebungsvariable überführt und in den Step-`if`s über
      # den `env`-Context geprüft (dort ist er erlaubt).
      #   'true'  → APPLE_CERTIFICATE-Secret hinterlegt → signiert bauen
      #   'false' → kein Zertifikat → unsigniert (Gatekeeper-Hinweis)
      APPLE_SIGNING_AVAILABLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Rust einrichten (beide Apple-Ziele für Universal-Binary)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: JavaScript-Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Version aus Tag/Dispatch ins tauri.conf.json schreiben
        env:
          RV: ${{ env.RELEASE_VERSION }}
        run: |
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));const v=(process.env.RV||"").replace(/^v/,"");if(v){c.version=v;fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");console.log("tauri.conf.json Version ->",v)}else{console.log("Keine Version gesetzt, behalte",c.version)}'

      # Node.js als Universal-Binary: beide Architekturen laden und per
      # lipo mergen — sonst würde die App auf Intel- oder M-Macs das
      # falsche node-Binary spawnen.
      - name: Node.js Universal-Binary bauen (x64 + arm64 → lipo)
        run: |
          set -euo pipefail
          node scripts/download-node.mjs --version ${{ env.NODE_VERSION }} --arch x64
          mkdir -p /tmp/kz-node-build
          mv portable-node/bin/node /tmp/kz-node-build/node-x64
          node scripts/download-node.mjs --version ${{ env.NODE_VERSION }} --arch arm64
          mv portable-node/bin/node /tmp/kz-node-build/node-arm64
          lipo -create /tmp/kz-node-build/node-x64 /tmp/kz-node-build/node-arm64 -output /tmp/kz-node-build/node-universal
          cp /tmp/kz-node-build/node-universal portable-node/bin/node
          chmod +x portable-node/bin/node
          echo "--- Verifikation ---"
          lipo -info portable-node/bin/node
          lipo -info portable-node/bin/node | grep -q x86_64
          lipo -info portable-node/bin/node | grep -q arm64
          echo "OK: Node.js ist ein Universal-Binary."

      # ONNX-Runtime: Microsoft liefert ein Universal2-Asset (x86_64 + arm64
      # bereits in EINER Datei) — kein lipo-Merge mehr nötig. Die frühere
      # „osx-x64“-Assetname-Falle (→ HTTP 404) ist im Script ebenfalls gefixt.
      - name: ONNX Runtime herunterladen (Universal2 x64+arm64)
        run: |
          set -euo pipefail
          node scripts/download-onnxruntime.mjs --version ${{ env.ONNX_VERSION }} --arch universal2
          ls -la src-tauri/bundled/native/
          echo "--- Verifikation ---"
          lipo -info src-tauri/bundled/native/libonnxruntime.dylib
          lipo -info src-tauri/bundled/native/libonnxruntime.dylib | grep -q x86_64
          lipo -info src-tauri/bundled/native/libonnxruntime.dylib | grep -q arm64
          echo "OK: ONNX Runtime ist ein Universal-Binary (Universal2-Asset)."

      - name: Frontend + Server-Bundle vorbereiten (prepare-bundle.mjs)
        env:
          NEXT_PUBLIC_LEADERBOARD_URL: ${{ secrets.NEXT_PUBLIC_LEADERBOARD_URL }}
          NEXT_PUBLIC_LEADERBOARD_API_KEY: ${{ secrets.NEXT_PUBLIC_LEADERBOARD_API_KEY }}
        run: node scripts/prepare-bundle.mjs

      # Ohne Apple-Secrets: unsignierter Build (Gatekeeper-Hinweis in den
      # Release-Notes). Mit Secrets: Signierung + Notarization direkt im
      # tauri build. (Bedingung via env-Relay, s. Job-env-Kommentar oben —
      # `secrets` in `if:` wäre ein Validierungsfehler.)
      - name: Tauri bauen (Universal, unsigniert)
        if: ${{ env.APPLE_SIGNING_AVAILABLE != 'true' }}
        run: bunx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Tauri bauen (Universal, signiert + notarisiert)
        if: ${{ env.APPLE_SIGNING_AVAILABLE == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bunx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Artefakt hochladen (Universal-DMG)
        uses: actions/upload-artifact@v5
        with:
          name: macos-universal-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  #  Linux — AppImage (WebKitGTK + Medien-Codecs gebündelt) + deb
  # ────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux · AppImage + deb
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    if: ${{ github.event.inputs.build_linux != 'false' }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust-Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ubuntu-22.04 = älteste noch übliche Baseline (glibc 2.35) → das
      # AppImage läuft auf praktisch allen aktuellen x64-Distributionen.
      # GStreamer-Pakete: werden per bundleMediaFramework (linuxdeploy-Plugin
      # „gstreamer“) ins AppImage gebündelt — gst-libav bringt die
      # H.264/AAC-Decoder, die WebKitGTK für Medien-Streams braucht.
      - name: System-Abhängigkeiten installieren (WebKitGTK 4.1, GStreamer-Codecs, ALSA, …)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libpulse-dev libssl-dev libxdo-dev \
            libfuse2 squashfs-tools desktop-file-utils appstream \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-gl

      - name: JavaScript-Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      - name: Version aus Tag/Dispatch ins tauri.conf.json schreiben
        env:
          RV: ${{ env.RELEASE_VERSION }}
        run: |
          node -e 'const fs=require("fs");const p="src-tauri/tauri.conf.json";const c=JSON.parse(fs.readFileSync(p,"utf8"));const v=(process.env.RV||"").replace(/^v/,"");if(v){c.version=v;fs.writeFileSync(p,JSON.stringify(c,null,2)+"\n");console.log("tauri.conf.json Version ->",v)}else{console.log("Keine Version gesetzt, behalte",c.version)}'

      - name: Portables Node.js herunterladen (bundled/node/bin/node)
        run: node scripts/download-node.mjs --version ${{ env.NODE_VERSION }}

      - name: ONNX Runtime herunterladen (bundled/native/libonnxruntime.so)
        run: node scripts/download-onnxruntime.mjs --version ${{ env.ONNX_VERSION }}

      - name: Frontend + Server-Bundle vorbereiten (prepare-bundle.mjs)
        env:
          NEXT_PUBLIC_LEADERBOARD_URL: ${{ secrets.NEXT_PUBLIC_LEADERBOARD_URL }}
          NEXT_PUBLIC_LEADERBOARD_API_KEY: ${{ secrets.NEXT_PUBLIC_LEADERBOARD_API_KEY }}
        run: node scripts/prepare-bundle.mjs

      # Linuxdeploy (vom Tauri-CLI aufgerufen) bündelt WebKitGTK samt
      # Helper-Prozessen (WebKitWebProcess & Co.) automatisch per
      # ldd-Auflösung. bundleMediaFramework=true (tauri.conf.json) aktiviert
      # zusätzlich den gstreamer-Plugin → die oben installierten Codec-
      # Pakete (H.264/AAC via gst-libav) wandern ins AppImage.
      - name: Tauri bauen (AppImage mit gebündeltem WebKit + Codecs, + deb)
        run: bunx tauri build --bundles deb,appimage

      - name: Artefakte prüfen + ausführbar markieren
        run: |
          set -euo pipefail
          echo "--- AppImage ---"
          ls -la src-tauri/target/release/bundle/appimage/
          chmod +x src-tauri/target/release/bundle/appimage/*.AppImage
          file src-tauri/target/release/bundle/appimage/*.AppImage
          echo "--- deb ---"
          ls -la src-tauri/target/release/bundle/deb/

      - name: Artefakte hochladen (AppImage + deb)
        uses: actions/upload-artifact@v5
        with:
          name: linux-standalone
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────
  #  Release — DRAFT mit allen Artefakten + Prüfsummen (ein einziger Job,
  #  daher keine Race-Conditions zwischen den Plattform-Builds)
  # ────────────────────────────────────────────────────────────────────
  release:
    name: GitHub Release (Draft)
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: >-
      always() &&
      !contains(join(needs.*.result, ','), 'failure') &&
      contains(join(needs.*.result, ','), 'success') &&
      (github.event_name == 'push' || github.event.inputs.create_release != 'false')
    permissions:
      contents: write
    steps:
      - name: Alle Build-Artefakte herunterladen
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Release-Dateien sammeln + Prüfsummen erzeugen
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} release-files/ \;
          count=$(find release-files -type f | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "::error::Keine Release-Dateien gefunden"
            exit 1
          fi
          cd release-files
          sha256sum * > SHA256SUMS.txt
          echo "--- Release-Dateien ---"
          ls -la
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS.txt

      - name: Draft-Release erstellen
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: 'Karaoke ZERO ${{ env.RELEASE_VERSION }}'
          body: |
            # 🎤 Karaoke ZERO ${{ env.RELEASE_VERSION }} — 100 % Standalone

            Diese Builds laufen auf **nackten Systemen**: kein installiertes Node.js,
            kein Browser, **keine Internetverbindung zur Installationszeit**
            (Online-Inhalte wie YouTube-Embeds natürlich ausgenommen).

            ## 📦 Downloads

            | Datei | Plattform | Hinweis |
            |---|---|---|
            | `*-setup.exe` | Windows x64 | NSIS-Installer — WebView2 ist **offline eingebettet**, keine Admin-Rechte nötig |
            | `*.dmg` | macOS **Universal** (Intel + Apple Silicon) | macOS ≥ 10.15 |
            | `*.AppImage` | Linux x64 | WebKitGTK **und** Medien-Codecs (H.264/AAC) sind gebündelt |
            | `*.deb` | Linux (Debian/Ubuntu) | Paket-Manager-Variante (nutzt System-WebKit) |
            | `SHA256SUMS.txt` | alle | Prüfsummen |

            ## 💻 Installation

            **Windows:** `*-setup.exe` ausführen — fertig.

            **macOS:** DMG öffnen → „Karaoke ZERO“ in den Programme-Ordner ziehen.
            > ⚠️ Unsignierter Build: beim ersten Start ggf. Rechtsklick → „Öffnen“
            > (Gatekeeper) oder im Terminal: `xattr -cr "/Applications/Karaoke ZERO.app"`

            **Linux (AppImage):**
            ```bash
            chmod +x Karaoke*.AppImage && ./Karaoke*.AppImage
            ```
            Ohne FUSE: `./Karaoke*.AppImage --appimage-extract-and-run`

            **Linux (deb):** `sudo apt install ./Karaoke*.deb`

            Prüfsummen verifizieren: `sha256sum -c SHA256SUMS.txt`
          draft: true
          prerelease: false
          files: release-files/*

  # ────────────────────────────────────────────────────────────────────
  #  Zusammenfassung (läuft immer, auch bei Fehlern)
  # ────────────────────────────────────────────────────────────────────
  build-summary:
    name: Zusammenfassung
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: always()
    steps:
      - name: Ergebnisse zusammenfassen
        run: |
          {
            echo "## 🏗️ Standalone-Build — Zusammenfassung"
            echo ""
            echo "Version: **${{ env.RELEASE_VERSION }}**"
            echo ""
            echo "| Plattform | Ergebnis |"
            echo "|---|---|"
            echo "| Windows (NSIS, offline-fähig) | ${{ needs.build-windows.result == 'success' && '✅ Erfolg' || '❌ Fehlgeschlagen/Skipped' }} |"
            echo "| macOS (Universal DMG) | ${{ needs.build-macos.result == 'success' && '✅ Erfolg' || '❌ Fehlgeschlagen/Skipped' }} |"
            echo "| Linux (AppImage + deb) | ${{ needs.build-linux.result == 'success' && '✅ Erfolg' || '❌ Fehlgeschlagen/Skipped' }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefakte auflisten
        uses: actions/download-artifact@v5
        with:
          path: all-artifacts
        continue-on-error: true

      - name: Artefakt-Übersicht
        continue-on-error: true
        run: |
          {
            echo "## 📦 Artefakte"
            echo ""
            find all-artifacts -type f 2>/dev/null | while read -r file; do
              size=$(du -h "$file" | cut -f1)
              echo "- \`$(basename "$file")\` ($size)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
